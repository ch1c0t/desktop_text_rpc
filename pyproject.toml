[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-text-rpc"
version = "0.1.0"
description = "Hobby-RPC service for OCR text detection on desktop screenshots"
requires-python = ">=3.13"
dependencies = [
  "hobbyrpc",
  "paddleocr>=2.7,<3.0",
  "paddlepaddle-gpu",
  "mss",
  "numpy",
  "Pillow",
  "Werkzeug",
]

[project.scripts]
desktop-text-rpc = "desktop_text_rpc.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
