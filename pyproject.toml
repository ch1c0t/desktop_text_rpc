[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-text-rpc"
version = "0.1.0"
description = "Hobby-RPC service for OCR text detection on desktop screenshots"
requires-python = ">=3.10"
dependencies = [
  "hobbyrpc",
  "paddleocr>=2.7,<3.0",
  "paddlepaddle",
  "mss",
  "numpy",
  "Pillow",
  "Werkzeug",
]

[project.scripts]
desktop-text-rpc = "desktop_text_rpc.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
