[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-text-rpc"
version = "0.1.0"
description = "Hobby-RPC service for OCR text detection on desktop screenshots"
requires-python = ">=3.10"
dependencies = [
  "hobbyrpc",
  "paddleocr>=2.7,<3.0",
  "paddlepaddle",
  "mss",
  "numpy",
  "Pillow",
  "Werkzeug",
]

[project.scripts]
desktop-text-rpc = "cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["server", "ocr_models", "cli", "prepare_models"]

[tool.pytest.ini_options]
pythonpath = ["."]
